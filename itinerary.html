<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itinerary · Tiare &amp; Tide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="itinerary">
<header id="site-header" class="site-header"></header>
<div class="trip-bar"><div class="wrap" id="tripbar"></div></div>
<main class="wrap">
  <div class="section-head" style="margin-top:28px">
    <div><p class="eyebrow">Day by day</p><h2>Your honeymoon itinerary</h2>
      <p>Drag activities and places to stay from the left onto a day (or tap <b>+</b>). Choose each day's island and the travel between islands appears automatically, with door-to-door times and costs. Everything is priced for two.</p></div>
    <div class="chips no-print"><button class="btn" id="print" type="button"></button><button class="btn ghost" id="reset" type="button">Reset itinerary</button></div>
  </div>
  <div class="settings" id="settings"></div>
  <div class="planner">
    <aside class="pool" id="pool" aria-label="Activities and stays to drag"></aside>
    <section aria-label="Days"><div class="days" id="days"></div></section>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="js/boot.js"></script>
<script src="js/itinerary.js"></script>
</body>
</html>
